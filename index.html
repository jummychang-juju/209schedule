<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>209班 115-1 行事曆・一鍵加入</title>
<style>
  :root{--ink:#1f2a24;--paper:#f7f5ef;--blue:#2d5a7a;--blue-soft:#e3edf4;--green:#2f6f4f;--line:#d8d3c6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.08)}
  .head{background:var(--blue-soft);padding:22px 20px 18px;text-align:center}
  .badge{display:inline-block;background:var(--blue);color:#fff;font-size:.8rem;font-weight:700;letter-spacing:.15em;padding:4px 14px;border-radius:999px;margin-bottom:10px}
  .head h1{font-size:1.2rem;letter-spacing:.05em;color:var(--blue)}
  .head p{font-size:.85rem;color:#5b6b76;margin-top:6px}
  .body{padding:20px 18px 24px}
  .opt{border:1.5px solid var(--line);border-radius:14px;padding:14px 14px 16px;margin-bottom:14px}
  .opt h3{font-size:.95rem;margin-bottom:4px}
  .opt p{font-size:.8rem;color:#6b6a60;margin-bottom:10px;line-height:1.6}
  button.btn{display:block;width:100%;border:none;color:#fff;font-size:1rem;font-weight:700;letter-spacing:.05em;padding:14px;border-radius:12px;cursor:pointer;transition:transform .08s ease}
  button.btn:active{transform:scale(.97)}
  .b1{background:var(--green)}
  .b2{background:var(--blue)}
  .steps{background:var(--paper);border-radius:12px;padding:13px 15px;font-size:.85rem;line-height:1.7}
  .steps b{color:var(--blue)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s ease;max-width:90%;text-align:center}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="badge">衛道 209 班</div>
    <h1>班親會導師版行事曆</h1>
    <p>依你的情況選一個按鈕就好</p>
  </div>
  <div class="body">
    <div class="opt">
      <h3>1️⃣ 我之前已經加入過行事曆</h3>
      <p>只補導師新公告的 9 筆：作文段考×2、英聽段考、各連假、寒輔。不會與已加入的重複。</p>
      <button class="btn b1" onclick="go('delta')">📅 一鍵加入新增的 9 筆</button>
    </div>
    <div class="opt">
      <h3>2️⃣ 我還沒加入過行事曆</h3>
      <p>一次加入班親會公告完整 15 筆：段考、連假、露營、運動會、寒輔、開學日。</p>
      <button class="btn b2" onclick="go('full')">📅 一鍵加入完整 15 筆</button>
    </div>
    <div class="steps">
      <b>🍎 iPhone</b>：用 Safari 開本頁 → 點按鈕 → 跳出行程畫面點「<b>加入全部</b>」（若跳出分享面板，選「儲存到檔案」再點開）<br>
      <b>🤖 Android</b>：點按鈕下載 → 通知列點開 → 用 <b>Google 日曆</b> 開啟 → 儲存<br>
      <b>💡 LINE 內開啟者</b>：請先點右下角「⋯」→「用預設瀏覽器開啟」
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const HEADER = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Claude//VTSH 209 115-1//ZH
CALSCALE:GREGORIAN
METHOD:PUBLISH
X-WR-CALNAME:衛道209 115-1 行事曆
X-WR-TIMEZONE:Asia/Taipei
BEGIN:VTIMEZONE
TZID:Asia/Taipei
BEGIN:STANDARD
DTSTART:19700101T000000
TZOFFSETFROM:+0800
TZOFFSETTO:+0800
TZNAME:CST
END:STANDARD
END:VTIMEZONE
`;
const FOOTER = `END:VCALENDAR`;
const EV = {
  moon:`BEGIN:VEVENT
UID:vtsh-209-115-1-001@claude
DTSTART;VALUE=DATE:20260925
DTEND;VALUE=DATE:20260929
SUMMARY:🥮 中秋節連假(9/25-9/28)
END:VEVENT
`,
  comp1:`BEGIN:VEVENT
UID:vtsh-209-115-1-002@claude
DTSTART;VALUE=DATE:20261002
DTEND;VALUE=DATE:20261003
SUMMARY:✍️ 作文第一次段考
BEGIN:VALARM
ACTION:DISPLAY
DESCRIPTION:明天作文段考
TRIGGER:-P1D
END:VALARM
END:VEVENT
`,
  nat:`BEGIN:VEVENT
UID:vtsh-209-115-1-003@claude
DTSTART;VALUE=DATE:20261009
DTEND;VALUE=DATE:20261012
SUMMARY:🇹🇼 國慶日連假(10/9-10/11)
END:VEVENT
`,
  exam1:`BEGIN:VEVENT

BEGIN:VALARM

TRIGGER:-P7D
END:VALARM
BEGIN:VALARM
ACTION:DISPLAY
DESCRIPTION:明天段考
TRIGGER:-P1D
END:VALARM
END:VEVENT
`,

UID:vtsh-209-115-1-005@claude
DTSTART;VALUE=DATE:20261024

SUMMARY:🎌 光復節連假(10/24-10/26)

`,
  camp:`BEGIN:VEVENT

DTEND;VALUE=DATE:20261109

BEGIN:VALARM

  open2:`BEGIN:VEVENT

DTSTART;VALUE=DATE:20270211

BEGIN:VALARM

TRIGGER:-P1D
END:VALARM
END:VEVENT
`
};
const SETS = {
  full:  {keys:["moon","comp1","nat","exam1","retro","camp","comp2","listen","exam2","sports","xmas","ny","exam3","winter","open2"], file:"衛道209行事曆_完整15筆.ics", ics:"full.ics"},
  delta: {keys:["moon","comp1","nat","retro","comp2","listen","xmas","ny","winter"], file:"衛道209行事曆_補充9筆.ics", ics:"delta.ics"}
};

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3500);
}

async function go(which){
  const set = SETS[which];

  // 1) 如果同目錄有放 .ics 檔（之後補上傳），直接開啟 → iPhone Safari 會跳出「加入全部」畫面
  try{
    const r = await fetch(set.ics, {method:'HEAD', cache:'no-store'});
    if (r.ok){
      location.href = set.ics;
      return;
    }
  }catch(e){}

  // 2) 單檔模式：內建資料，走分享面板 / 下載
  const data = (HEADER + set.keys.map(k=>EV[k]).join("") + FOOTER).replace(/\n/g,'\r\n');
  try{
    const file = new File([data], set.file, {type:'text/calendar'});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:set.file});
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return;
  }
  const blob = new Blob([data], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = set.file;
  a.style.display = 'none';
  document.body.appendChild(a);
  if (typeof a.download !== 'undefined'){
    a.click();
    showToast('已開始下載，請點開下載的檔案加入行事曆');
  } else {
    showToast('此視窗無法下載，請改用 Safari / Chrome 開啟本頁');
  }
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}
</script>
